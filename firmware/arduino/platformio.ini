; firmware/arduino/platformio.ini -- flash the receiver WITHOUT the Arduino IDE.
;
; E32Receiver is an Arduino IDE sketch first: open E32Receiver/E32Receiver.ino in
; the IDE and it just works. This file is a second, optional way in, for when the
; IDE is not installed or you would rather stay on the command line.
;
;   pio run -e uno   -t upload      # Uno / Nano bench setup
;   pio run -e mega  -t upload      # Mega 2560
;   pio run -e esp32 -t upload      # ESP32 DevKitC
;   pio device monitor -b 115200    # watch the decoded telemetry
;
; Run these from THIS directory (firmware/arduino/), not firmware/.
;
; Deliberately a separate project from firmware/platformio.ini: that one builds
; the two flight targets out of firmware/src, and pointing it at a third source
; tree with its own copy of TelemPacket.h would only invite the two to collide.
; Keeping them apart means the sketch stays a sketch.

[platformio]
src_dir = E32Receiver

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Bench target: the 5 V Uno. Remember the divider on TX -> E32 RXD.
[env:uno]
platform = atmelavr
board = uno

[env:mega]
platform = atmelavr
board = megaatmega2560

; Same pin map as firmware/src/bridge.cpp, so the boards are interchangeable.
[env:esp32]
platform = espressif32
board = esp32dev
