; firmware/platformio.ini -- one build target per (role, vehicle).
;
;   pio run -e bridge_a     -t upload      # rocket A's ground station  (433.3 MHz)
;   pio run -e onboard_tx_a -t upload      # rocket A's airborne TX     (433.3 MHz)
;   pio run -e bridge_b     -t upload      # rocket B's ground station  (434.1 MHz)
;   pio run -e onboard_tx_b -t upload      # rocket B's airborne TX     (434.1 MHz)
;   pio run                                # compile ALL FOUR -- a build check, no upload
;   pio device monitor -b 115200                          # watch any board
;
; -e IS NOT OPTIONAL FOR UPLOAD. There is deliberately no env that means "the
; bridge" or "the rocket" any more, because there is no longer one of either --
; see lib/LoRaLink/LoRaLink.h for why two vehicles cannot share a channel. Naming
; the vehicle at flash time is the only place that choice is recorded, so it is
; made a required argument rather than a default someone can forget.
;
; The radio is a BARE SX1278 (Ra-01 / Ra-02) on SPI, not an EBYTE E32. All targets
; share lib/LoRaLink -- the single copy of the frequency/SF/bandwidth settings the
; two ends must agree on. onboard_tx also uses lib/TelemPacket (the byte-for-byte C
; mirror of shared/protocol/PROTOCOL.md). build_src_filter picks exactly one main
; per environment so the targets stay independently flashable.
;
; lib/E32 is left over from the E32 radio and is no longer built by any target
; (nothing #includes it, so the dependency finder skips it). It survives only
; because firmware/arduino/ still copies from it -- see that folder's README.
;
; Fully offline: `pio pkg install` once with a network, thereafter builds are local.

[platformio]
; All four, so a bare `pio run` compiles every vehicle and a break in rocket B's
; build surfaces on the bench instead of on flight day. Upload still needs -e.
default_envs = bridge_a, bridge_b, onboard_tx_a, onboard_tx_b

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall
; The SX1278 driver, needed by every target.
;   pio pkg install     # once, with a network; offline thereafter
lib_deps =
    sandeepmistry/LoRa@^0.8.0

; --- per-vehicle radio channels --------------------------------------------
; A vehicle is its channel: rocket A's TX and rocket A's bridge share one, and
; nothing else on the field uses it. Both sit inside Malaysia's 433 MHz ISM
; allocation (MCMC: 433.05-434.79 MHz) and are 800 kHz apart -- comfortably wider
; than the 125 kHz occupied bandwidth, so the two links do not overlap even at
; the skirts. Adding a rocket C means adding a section here, not editing one.
[vehicle_a]
build_flags = -DLORA_CHANNEL_HZ=433300000

[vehicle_b]
build_flags = -DLORA_CHANNEL_HZ=434100000

; --- role: GS-side bridge ---------------------------------------------------
; Cheapest classic ESP32 DevKitC / WROOM-32.
[bridge_base]
board = esp32dev
build_src_filter = +<bridge.cpp>

[env:bridge_a]
extends = bridge_base
build_flags = ${env.build_flags} ${vehicle_a.build_flags}

[env:bridge_b]
extends = bridge_base
build_flags = ${env.build_flags} ${vehicle_b.build_flags}

; --- role: airborne telemetry TX --------------------------------------------
; Runs on the ESP32-S3 flight computer. -DARDUINO_USB_CDC_ON_BOOT=1 makes `Serial`
; the USB CDC port on the S3 so the debug prints appear over USB without extra
; setup.
;
; Flight sensors, ON TOP OF the shared LoRa driver -- ${env.lib_deps} is not
; optional here: a bare lib_deps in a section REPLACES the [env] list rather than
; extending it, which would silently leave this target without a radio library.
; Only this role pulls the sensors in; the bridge is a dumb passthrough and must
; not grow sensor dependencies. Adafruit's BMP280 library drags in Adafruit BusIO
; + Unified Sensor automatically.
;   pio pkg install -e onboard_tx_a     # once, with a network; offline thereafter
[onboard_tx_base]
board = esp32-s3-devkitc-1
build_src_filter = +<onboard_tx.cpp>
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.2.13
    adafruit/Adafruit BMP280 Library@^2.6.8
    mikalhart/TinyGPSPlus@^1.0.3

[env:onboard_tx_a]
extends = onboard_tx_base
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 ${vehicle_a.build_flags}

[env:onboard_tx_b]
extends = onboard_tx_base
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 ${vehicle_b.build_flags}
