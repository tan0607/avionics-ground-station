; firmware/platformio.ini -- two build targets for the rocket telemetry link.
;
;   pio run -e bridge       -t upload      # GS-side bridge (Target 1)
;   pio run -e onboard_tx   -t upload      # airborne telemetry TX (Target 2)
;   pio device monitor -b 115200                          # watch either board
;
; Both targets share lib/E32 (the AUX-disciplined radio driver). onboard_tx also
; uses lib/TelemPacket (the byte-for-byte C mirror of shared/protocol/PROTOCOL.md).
; build_src_filter picks exactly one main per environment so the two targets stay
; independently flashable and independently committed.
;
; Fully offline: `pio pkg install` once with a network, thereafter builds are local.

[platformio]
default_envs = bridge, onboard_tx

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Target 1: GS-side bridge -- cheapest classic ESP32 DevKitC / WROOM-32.
[env:bridge]
board = esp32dev
build_src_filter = +<bridge.cpp>

; Target 2: airborne telemetry TX -- runs on the ESP32-S3 flight computer.
; -DARDUINO_USB_CDC_ON_BOOT=1 makes `Serial` the USB CDC port on the S3 so the
; debug prints appear over USB without extra setup.
[env:onboard_tx]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<onboard_tx.cpp>
